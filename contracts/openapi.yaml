openapi: 3.0.3
info:
  title: Crew Challenges API
  version: 1.0.0
paths:
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf
      description: GET /api/v1/auth/csrf - sets the crew_csrftoken cookie; call it
        before the first POST.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfOut'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login
      description: POST /api/v1/auth/login - starts a session. Then call GET /api/v1/me.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/logout:
    post:
      operationId: auth_logout
      description: POST /api/v1/auth/logout - ends the session.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/challenges:
    get:
      operationId: challenges_list
      description: Scheduled challenges, by start date.
      parameters:
      - in: query
        name: phase
        schema:
          type: string
        description: 'Comma-separated: upcoming, active, finished. Default: all three.'
      tags:
      - challenges
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChallengeOut'
          description: ''
    post:
      operationId: challenges_create
      description: Add a proposal to the crew's pool (409 pool_full when it is full).
      tags:
      - challenges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeOut'
          description: ''
  /api/v1/challenges/{challenge_id}:
    get:
      operationId: challenges_retrieve
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - challenges
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeOut'
          description: ''
    put:
      operationId: challenges_update
      description: The creator replaces their proposal while it is in the pool. Resets
        its votes.
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - challenges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeOut'
          description: ''
    delete:
      operationId: challenges_destroy
      description: The creator or an admin withdraws a proposal from the pool.
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - challenges
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/challenges/{challenge_id}/board:
    get:
      operationId: challenges_board
      description: Every participant's month, one state per day.
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: month
        schema:
          type: string
        description: YYYY-MM; default this month.
      tags:
      - challenges
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardOut'
          description: ''
  /api/v1/challenges/{challenge_id}/check-ins:
    post:
      operationId: challenges_check_in
      description: Check in for today (numbers add up). Returns the challenge as on
        today's card.
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - challenges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayChallengeOut'
          description: ''
  /api/v1/challenges/{challenge_id}/check-ins/{day}/last:
    delete:
      operationId: challenges_undo
      description: Undo today's last entry (`day` is today, YYYY-MM-DD). The last
        one takes its proofs.
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: day
        schema:
          type: string
        required: true
      tags:
      - challenges
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/challenges/{challenge_id}/check-ins/{day}/proofs:
    post:
      operationId: proofs_start
      description: Add a photo or video to today's check-in. Then send the file straight
        to storage.
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: day
        schema:
          type: string
        required: true
      tags:
      - challenges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofStartInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofUploadOut'
          description: ''
  /api/v1/challenges/{challenge_id}/days/{day}:
    get:
      operationId: challenges_day_sheet
      description: Everyone's state, total and proofs on one day (`day` is YYYY-MM-DD),
        in join order.
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: day
        schema:
          type: string
        required: true
      tags:
      - challenges
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DaySheetRowOut'
          description: ''
  /api/v1/challenges/{challenge_id}/participants:
    put:
      operationId: challenges_participants
      description: The creator changes who takes part while the challenge is a proposal.
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - challenges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantsInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeOut'
          description: ''
  /api/v1/challenges/{challenge_id}/participation:
    delete:
      operationId: challenges_leave
      description: |-
        Opt out before the start, or leave a running challenge (today still counts).

        Either way the challenge is gone for the member afterwards (an admin still sees it).
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - challenges
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/challenges/{challenge_id}/schedule:
    put:
      operationId: challenges_schedule
      description: 'Admin: schedule a proposal for a period, or move it before it
        starts.'
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - challenges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeOut'
          description: ''
    delete:
      operationId: challenges_unschedule
      description: 'Admin: put a scheduled challenge back in the pool before it starts.'
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - challenges
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/challenges/{challenge_id}/vote:
    put:
      operationId: challenges_vote
      description: Vote for a proposal (voting twice counts once).
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - challenges
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeOut'
          description: ''
    delete:
      operationId: challenges_vote_clear
      description: Take your vote back.
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - challenges
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/crew:
    get:
      operationId: crew_retrieve
      description: The crew the user is acting in, with its members in the order they
        joined.
      tags:
      - crew
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewDetailOut'
          description: ''
  /api/v1/crew/invites:
    get:
      operationId: crew_invites_list
      description: 'Admin: the crew''s pending invites, and creating a single-use
        invite valid for 7 days.'
      tags:
      - crew
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingInviteOut'
          description: ''
    post:
      operationId: crew_invites_create
      description: 'Admin: the crew''s pending invites, and creating a single-use
        invite valid for 7 days.'
      tags:
      - crew
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteOut'
          description: ''
  /api/v1/crew/invites/{invite_id}:
    delete:
      operationId: crew_invites_destroy
      description: 'Admin: cancel an invite nobody has used yet.'
      parameters:
      - in: path
        name: invite_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - crew
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/feed:
    get:
      operationId: feed_list
      description: The crew's check-ins with their proofs, latest activity first.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - feed
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFeedItemOutList'
          description: ''
  /api/v1/invites/{code}:
    get:
      operationId: invites_retrieve
      description: 'Public: what the join page shows before the person signs up.'
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - invites
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreviewOut'
          description: ''
  /api/v1/invites/{code}/accept:
    post:
      operationId: invites_accept
      description: 'Public: create an account from an invite, join the crew, and log
        in.'
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteInRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
          description: ''
  /api/v1/invites/{code}/join:
    post:
      operationId: invites_join
      description: 'Logged in: join the invite''s crew with the account you already
        have.'
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinWithAccountInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      description: The logged-in user, their membership and crew (member and crew
        are null outside a crew).
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
          description: ''
    patch:
      operationId: me_update
      description: The logged-in user, their membership and crew (member and crew
        are null outside a crew).
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMePatchInRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
          description: ''
  /api/v1/me/crew:
    put:
      operationId: me_crew_update
      description: Switch the crew the user acts in (for people in several crews).
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveCrewInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
          description: ''
  /api/v1/media/session:
    post:
      operationId: media_session
      description: |-
        Set the cookies that let this browser load the crew's photos and videos.

        Call it when the app starts, after switching crews, and before `expires_at`.
      tags:
      - media
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSessionOut'
          description: ''
  /api/v1/members/{member_id}/progress:
    get:
      operationId: members_progress
      description: 'A member''s month: streaks, each challenge''s days and their proofs
        by day.'
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: month
        schema:
          type: string
        description: YYYY-MM; default this month.
      tags:
      - members
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberProgressOut'
          description: ''
  /api/v1/proofs/{proof_id}:
    delete:
      operationId: proofs_delete
      description: Remove my proof and its files (only on its own day).
      parameters:
      - in: path
        name: proof_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - proofs
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/proofs/{proof_id}/complete:
    post:
      operationId: proofs_complete
      description: 'The file is uploaded: check it and show the proof. Safe to repeat.'
      parameters:
      - in: path
        name: proof_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - proofs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofOut'
          description: ''
  /api/v1/proofs/{proof_id}/parts:
    post:
      operationId: proofs_sign_parts
      description: Fresh URLs to PUT these parts to (also when earlier ones expired).
      parameters:
      - in: path
        name: proof_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - proofs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartsInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartsOut'
          description: ''
  /api/v1/proofs/{proof_id}/parts/{number}:
    put:
      operationId: proofs_record_part
      description: Report a finished part and its ETag, so a later resume skips it.
      parameters:
      - in: path
        name: number
        schema:
          type: integer
        required: true
      - in: path
        name: proof_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - proofs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/proofs/resume:
    get:
      operationId: proofs_resume
      description: My unfinished video upload for this file (name|size|lastModified),
        or 404.
      parameters:
      - in: query
        name: fingerprint
        schema:
          type: string
        required: true
      tags:
      - proofs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofUploadOut'
          description: ''
  /api/v1/proposals:
    get:
      operationId: proposals_list
      description: The crew's pool of proposals, newest first, with votes and how
        full it is.
      tags:
      - proposals
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolOut'
          description: ''
  /api/v1/reactions/{target}/{target_id}:
    put:
      operationId: reactions_set
      description: React with one emoji; another one replaces yours. Returns the target's
        reactions.
      parameters:
      - in: path
        name: target
        schema:
          type: string
          enum:
          - check_in
        description: What kind of thing the id is.
        required: true
      - in: path
        name: target_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - reactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactionSummaryOut'
          description: ''
    delete:
      operationId: reactions_clear
      description: Take your reaction back. Returns the target's reactions.
      parameters:
      - in: path
        name: target
        schema:
          type: string
          enum:
          - check_in
        description: What kind of thing the id is.
        required: true
      - in: path
        name: target_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - reactions
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/today:
    get:
      operationId: today_retrieve
      description: My challenges today with their state, and the crew's progress.
      tags:
      - today
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayOut'
          description: ''
components:
  schemas:
    AcceptInviteInRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 30
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        display_name:
          type: string
          minLength: 1
          maxLength: 40
        preferred_language:
          allOf:
          - $ref: '#/components/schemas/PreferredLanguageEnum'
          description: |-
            The language used to sign up.

            * `ro` - Romana
            * `en` - English
      required:
      - display_name
      - password
      - username
    ActiveCrewInRequest:
      type: object
      properties:
        crew_id:
          type: string
          format: uuid
      required:
      - crew_id
    BoardOut:
      type: object
      properties:
        days:
          type: array
          items:
            type: string
            format: date
        rows:
          type: array
          items:
            $ref: '#/components/schemas/BoardRowOut'
      required:
      - days
      - rows
    BoardRowOut:
      type: object
      properties:
        member:
          $ref: '#/components/schemas/PersonOut'
        states:
          type: array
          items:
            $ref: '#/components/schemas/DayStateEnum'
          description: One per day.
        streak:
          type: integer
          nullable: true
        proof_days:
          type: array
          items:
            type: string
            format: date
          description: Days of the month with proof.
      required:
      - member
      - proof_days
      - states
      - streak
    ChallengeBriefOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        icon:
          $ref: '#/components/schemas/IconEnum'
        measure:
          $ref: '#/components/schemas/MeasureEnum'
        unit:
          type: string
      required:
      - icon
      - id
      - measure
      - title
      - unit
    ChallengeInRequest:
      type: object
      description: The creator's choices. Combinations are checked in services.clean_shape.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 60
        rules:
          type: string
          default: ''
          maxLength: 500
        icon:
          allOf:
          - $ref: '#/components/schemas/IconEnum'
          default: star
        measure:
          $ref: '#/components/schemas/MeasureEnum'
        unit:
          type: string
          default: ''
          maxLength: 20
        window:
          allOf:
          - $ref: '#/components/schemas/WindowEnum'
          description: |-
            The unit that is judged.

            * `day` - Each day
            * `week` - Each week, Monday to Sunday
            * `period` - The whole period
        on_days:
          type: array
          items:
            type: integer
            maximum: 6
            minimum: 0
          description: 'Day windows only: the weekdays that count, 0 = Monday ...
            6 = Sunday; empty = every day.'
          maxItems: 7
        need_kind:
          $ref: '#/components/schemas/NeedKindEnum'
        need_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: 'What each window needs: check-ins (1 for a day), or a total
            (numbers only).'
        day_min:
          type: string
          format: decimal
