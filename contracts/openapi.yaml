openapi: 3.0.3
info:
  title: Crew Challenges API
  version: 1.0.0
paths:
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf
      description: GET /api/v1/auth/csrf - sets the csrftoken cookie; call it before
        the first POST.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfOut'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login
      description: POST /api/v1/auth/login - starts a session. Then call GET /api/v1/me.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/logout:
    post:
      operationId: auth_logout
      description: POST /api/v1/auth/logout - ends the session.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/challenges:
    get:
      operationId: challenges_list
      description: Chosen challenges, by start date.
      parameters:
      - in: query
        name: phase
        schema:
          type: string
        description: 'Comma-separated: upcoming, active, finished. Default: all three.'
      tags:
      - challenges
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChallengeOut'
          description: ''
    post:
      operationId: challenges_create
      description: Propose a challenge for the open round.
      tags:
      - challenges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeOut'
          description: ''
  /api/v1/challenges/{challenge_id}:
    get:
      operationId: challenges_retrieve
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - challenges
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeDetailOut'
          description: ''
    put:
      operationId: challenges_update
      description: The creator replaces their proposal while the round is open. Resets
        its votes.
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - challenges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeOut'
          description: ''
    delete:
      operationId: challenges_destroy
      description: The creator or an admin withdraws a proposal while the round is
        open.
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - challenges
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/challenges/{challenge_id}/participation:
    put:
      operationId: challenges_take_part
      description: Take part again (before the start).
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - challenges
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeDetailOut'
          description: ''
    delete:
      operationId: challenges_opt_out
      description: Opt out before the start, or leave a running challenge from tomorrow.
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - challenges
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/challenges/{challenge_id}/repropose:
    post:
      operationId: challenges_repropose
      description: Propose a challenge that was not chosen again, in the open round.
      parameters:
      - in: path
        name: challenge_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - challenges
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeOut'
          description: ''
  /api/v1/crew:
    get:
      operationId: crew_retrieve
      description: The crew the user is acting in, with its members in the order they
        joined.
      tags:
      - crew
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewDetailOut'
          description: ''
  /api/v1/crew/invites:
    get:
      operationId: crew_invites_list
      description: 'Admin: the crew''s pending invites, and creating a single-use
        invite valid for 7 days.'
      tags:
      - crew
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingInviteOut'
          description: ''
    post:
      operationId: crew_invites_create
      description: 'Admin: the crew''s pending invites, and creating a single-use
        invite valid for 7 days.'
      tags:
      - crew
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteOut'
          description: ''
  /api/v1/crew/invites/{invite_id}:
    delete:
      operationId: crew_invites_destroy
      description: 'Admin: cancel an invite nobody has used yet.'
      parameters:
      - in: path
        name: invite_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - crew
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/invites/{code}:
    get:
      operationId: invites_retrieve
      description: 'Public: what the join page shows before the person signs up.'
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - invites
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreviewOut'
          description: ''
  /api/v1/invites/{code}/accept:
    post:
      operationId: invites_accept
      description: 'Public: create an account from an invite, join the crew, and log
        in.'
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteInRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
          description: ''
  /api/v1/invites/{code}/join:
    post:
      operationId: invites_join
      description: 'Logged in: join the invite''s crew with the account you already
        have.'
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - invites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinWithAccountInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      description: The logged-in user, their membership and crew (member and crew
        are null outside a crew).
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
          description: ''
    patch:
      operationId: me_update
      description: The logged-in user, their membership and crew (member and crew
        are null outside a crew).
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMePatchInRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
          description: ''
  /api/v1/me/crew:
    put:
      operationId: me_crew_update
      description: Switch the crew the user acts in (for people in several crews).
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveCrewInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
          description: ''
  /api/v1/rounds/{round_id}:
    get:
      operationId: rounds_retrieve
      parameters:
      - in: path
        name: round_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - rounds
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundOut'
          description: ''
  /api/v1/rounds/{round_id}/choice:
    put:
      operationId: rounds_choose
      description: 'Admin: choose the round''s challenge, or change the choice before
        it starts.'
      parameters:
      - in: path
        name: round_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - rounds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRefInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundOut'
          description: ''
  /api/v1/rounds/{round_id}/vote:
    put:
      operationId: rounds_vote
      description: Vote for a proposal in this round (replaces your vote), or clear
        your vote.
      parameters:
      - in: path
        name: round_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - rounds
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRefInRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundOut'
          description: ''
    delete:
      operationId: rounds_vote_clear
      description: Vote for a proposal in this round (replaces your vote), or clear
        your vote.
      parameters:
      - in: path
        name: round_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - rounds
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/rounds/current:
    get:
      operationId: rounds_current
      description: The round people propose and vote in now (created on first use).
      tags:
      - rounds
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundOut'
          description: ''
components:
  schemas:
    AcceptInviteInRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 30
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        display_name:
          type: string
          minLength: 1
          maxLength: 40
        preferred_language:
          allOf:
          - $ref: '#/components/schemas/PreferredLanguageEnum'
          description: |-
            The language used to sign up.

            * `ro` - Romana
            * `en` - English
      required:
      - display_name
      - password
      - username
    ActiveCrewInRequest:
      type: object
      properties:
        crew_id:
          type: string
          format: uuid
      required:
      - crew_id
    ChallengeDetailOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        round_id:
          type: string
          format: uuid
        title:
          type: string
        rules:
          type: string
        icon:
          $ref: '#/components/schemas/IconEnum'
        measure:
          $ref: '#/components/schemas/MeasureEnum'
        unit:
          type: string
        frequency:
          $ref: '#/components/schemas/FrequencyEnum'
        weekdays:
          type: array
          items:
            type: integer
        times:
          type: integer
          nullable: true
        target_scope:
          $ref: '#/components/schemas/TargetScopeEnum'
        target_value:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        proof_kind:
          $ref: '#/components/schemas/ProofKindEnum'
        proof_required:
          type: boolean
        state:
          $ref: '#/components/schemas/ChallengeStateEnum'
        phase:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PhaseEnum'
          - $ref: '#/components/schemas/NullEnum'
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/PersonOut'
          nullable: true
        created_at:
          type: string
          format: date-time
        revision:
          type: integer
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ParticipantOut'
        taking_part:
          type: boolean
          description: The current member counts in it today.
      required:
      - created_at
      - created_by
      - end_date
      - frequency
      - icon
      - id
      - measure
      - participants
      - phase
      - proof_kind
      - proof_required
      - revision
      - round_id
      - rules
      - start_date
      - state
      - taking_part
      - target_scope
      - target_value
      - times
      - title
      - unit
      - weekdays
    ChallengeInRequest:
      type: object
      description: The creator's choices. Combinations are checked in services.clean_shape.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 60
        rules:
          type: string
          default: ''
          maxLength: 500
        icon:
          allOf:
          - $ref: '#/components/schemas/IconEnum'
          default: star
        measure:
          $ref: '#/components/schemas/MeasureEnum'
        unit:
          type: string
          default: ''
          maxLength: 20
        frequency:
          $ref: '#/components/schemas/FrequencyEnum'
        weekdays:
          type: array
          items:
            type: integer
            maximum: 6
            minimum: 0
          description: 'For frequency=weekdays: 0 = Monday ... 6 = Sunday.'
          maxItems: 7
        times:
          type: integer
          minimum: 1
          nullable: true
        target_scope:
          allOf:
          - $ref: '#/components/schemas/TargetScopeEnum'
          default: none
        target_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        proof_kind:
          allOf:
          - $ref: '#/components/schemas/ProofKindEnum'
          default: none
        proof_required:
          type: boolean
          default: false
      required:
      - frequency
      - measure
      - title
    ChallengeOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        round_id:
          type: string
          format: uuid
        title:
          type: string
        rules:
          type: string
        icon:
          $ref: '#/components/schemas/IconEnum'
        measure:
          $ref: '#/components/schemas/MeasureEnum'
        unit:
          type: string
        frequency:
          $ref: '#/components/schemas/FrequencyEnum'
        weekdays:
          type: array
          items:
            type: integer
        times:
          type: integer
          nullable: true
        target_scope:
          $ref: '#/components/schemas/TargetScopeEnum'
        target_value:
          type: number
          format: double
          maximum: 100000000
          minimum: -100000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          nullable: true
        proof_kind:
          $ref: '#/components/schemas/ProofKindEnum'
        proof_required:
          type: boolean
        state:
          $ref: '#/components/schemas/ChallengeStateEnum'
        phase:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PhaseEnum'
          - $ref: '#/components/schemas/NullEnum'
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/PersonOut'
          nullable: true
        created_at:
          type: string
          format: date-time
        revision:
          type: integer
      required:
      - created_at
      - created_by
      - end_date
      - frequency
      - icon
      - id
      - measure
      - phase
      - proof_kind
      - proof_required
      - revision
      - round_id
      - rules
      - start_date
      - state
      - target_scope
      - target_value
      - times
      - title
      - unit
      - weekdays
    ChallengeRefInRequest:
      type: object
      properties:
        challenge_id:
          type: string
          format: uuid
      required:
      - challenge_id
    ChallengeStateEnum:
      enum:
      - proposed
      - chosen
      - not_chosen
      type: string
      description: |-
        * `proposed` - Proposed
        * `chosen` - Chosen
        * `not_chosen` - Not chosen
    CrewDetailOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberOut'
          description: In the order they joined.
      required:
      - id
      - members
      - name
      - timezone
    CrewOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
      required:
      - id
      - name
      - timezone
    CsrfOut:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    FrequencyEnum:
      enum:
      - daily
      - weekdays
      - times_per_week
      - times_per_period
      - once
      type: string
      description: |-
        * `daily` - Every day
        * `weekdays` - Chosen days of the week
        * `times_per_week` - A number of times a week
        * `times_per_period` - A number of times in the period
        * `once` - Once, by the end
    IconEnum:
      enum:
      - dumbbell
      - running
      - book
      - water
      - sugar
      - phone
      - sleep
      - walk
      - meditate
      - food
      - money
      - star
      type: string
      description: |-
        * `dumbbell` - dumbbell
        * `running` - running
        * `book` - book
        * `water` - water
        * `sugar` - sugar
        * `phone` - phone
        * `sleep` - sleep
        * `walk` - walk
        * `meditate` - meditate
        * `food` - food
        * `money` - money
        * `star` - star
    InviteOut:
      type: object
      properties:
        code:
          type: string
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
      required:
      - code
      - expires_at
      - url
    InvitePreviewOut:
      type: object
      properties:
        crew_name:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        expires_at:
          type: string
          format: date-time
        invited_by:
          allOf:
          - $ref: '#/components/schemas/MemberSummaryOut'
          nullable: true
          description: Who created the invite. Only for valid invites.
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberSummaryOut'
          description: Members in the order they joined. Empty unless the invite is
            valid.
        already_member:
          type: boolean
          description: True when the logged-in user is already in this crew.
        crew_id:
          type: string
          format: uuid
          nullable: true
          description: The crew's id, only for its own members (to switch to it).
      required:
      - already_member
      - crew_id
      - crew_name
      - expires_at
      - invited_by
      - members
      - status
    JoinWithAccountInRequest:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 40
      required:
      - display_name
    LoginInRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - password
      - username
    MeOut:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserOut'
        member:
          allOf:
          - $ref: '#/components/schemas/MemberOut'
          nullable: true
        crew:
          allOf:
          - $ref: '#/components/schemas/CrewOut'
          nullable: true
        crews:
          type: array
          items:
            $ref: '#/components/schemas/MembershipOut'
          description: Every crew the user belongs to, by name.
      required:
      - crew
      - crews
      - member
      - user
    MeasureEnum:
      enum:
      - check
      - quantity
      - abstain
      type: string
      description: |-
        * `check` - Just check in
        * `quantity` - A number with a unit
        * `abstain` - Held it (did not do something)
    MemberOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        role:
          type: string
        avatar_seed:
          type: string
      required:
      - avatar_seed
      - display_name
      - id
      - role
    MemberSummaryOut:
      type: object
      properties:
        display_name:
          type: string
        avatar_seed:
          type: string
      required:
      - avatar_seed
      - display_name
    MembershipOut:
      type: object
      properties:
        crew_id:
          type: string
          format: uuid
        crew_name:
          type: string
        display_name:
          type: string
        role:
          type: string
      required:
      - crew_id
      - crew_name
      - display_name
      - role
    NullEnum:
      enum:
      - null
    ParticipantOut:
      type: object
      properties:
        member:
          $ref: '#/components/schemas/PersonOut'
        joined_on:
          type: string
          format: date
        ended_on:
          type: string
          format: date
          nullable: true
      required:
      - ended_on
      - joined_on
      - member
    PatchedMePatchInRequest:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 40
        preferred_language:
          $ref: '#/components/schemas/PreferredLanguageEnum'
    PendingInviteOut:
      type: object
      properties:
        code:
          type: string
        url:
          type: string
          format: uri
        expires_at:
          type: string
