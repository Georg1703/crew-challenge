      required:
      - challenge_id
      - content_type
      - day
      - mode
      - part_count
      - part_size
      - parts
      - proof
      - put_url
      - thumb_put_url
    ReactionGroupOut:
      type: object
      properties:
        emoji:
          type: string
        member_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Who used it, in the order they did.
      required:
      - emoji
      - member_ids
    ReactionInRequest:
      type: object
      properties:
        emoji:
          type: string
          minLength: 1
          maxLength: 32
      required:
      - emoji
    ReactionSummaryOut:
      type: object
      description: A target's reactions. Embedded wherever a reactable thing is shown.
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ReactionGroupOut'
          description: In the order each emoji was first used.
        mine:
          type: string
          nullable: true
          description: Your reaction, if any.
      required:
      - groups
      - mine
    ScheduleInRequest:
      type: object
      properties:
        period_kind:
          $ref: '#/components/schemas/PeriodKindEnum'
        period_start:
          type: string
          format: date
          description: First day of the period (the 1st for a month).
      required:
      - period_kind
      - period_start
    StatusEnum:
      enum:
      - valid
      - expired
      - used
      type: string
      description: |-
        * `valid` - valid
        * `expired` - expired
        * `used` - used
    TodayChallengeOut:
      type: object
      description: 'One of my challenges today: what to show on its card and in the
        ring.'
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        icon:
          $ref: '#/components/schemas/IconEnum'
        measure:
          $ref: '#/components/schemas/MeasureEnum'
        unit:
          type: string
        window:
          $ref: '#/components/schemas/WindowEnum'
        need_kind:
          $ref: '#/components/schemas/NeedKindEnum'
        need_value:
          type: number
          format: double
        day_min:
          type: number
          format: double
          nullable: true
        proof_kind:
          $ref: '#/components/schemas/ProofKindEnum'
        proof_required:
          type: boolean
        end_date:
          type: string
          format: date
        state:
          allOf:
          - $ref: '#/components/schemas/DayStateEnum'
          description: |-
            Today's state.

            * `done` - done
            * `partial` - partial
            * `todo` - todo
            * `open` - open
            * `missed` - missed
            * `not_due` - not_due
            * `future` - future
            * `outside` - outside
        total:
          type: number
          format: double
          nullable: true
          description: Today's total (numbers only).
        streak:
          type: integer
          nullable: true
        week:
          type: array
          items:
            $ref: '#/components/schemas/DayOut'
          description: Monday to Sunday of this week.
        progress:
          allOf:
          - $ref: '#/components/schemas/ProgressOut'
          nullable: true
          description: Toward the week's or the period's goal.
        settled:
          type: boolean
          nullable: true
          description: 'Today''s ring segment: full, empty, or none (null).'
        proofs:
          type: array
          items:
            $ref: '#/components/schemas/ProofOut'
          description: Today's proofs, uploads in flight too.
        proof_days:
          type: array
          items:
            type: string
            format: date
          description: Days of this week with proof.
      required:
      - day_min
      - end_date
      - icon
      - id
      - measure
      - need_kind
      - need_value
      - progress
      - proof_days
      - proof_kind
      - proof_required
      - proofs
      - settled
      - state
      - streak
      - title
      - total
      - unit
      - week
      - window
    TodayOut:
      type: object
      properties:
        day:
          type: string
          format: date
        deadline:
          type: string
          format: date-time
          description: When today ends (crew-local midnight).
        challenges:
          type: array
          items:
            $ref: '#/components/schemas/TodayChallengeOut'
        crew:
          type: array
          items:
            $ref: '#/components/schemas/CrewDayOut'
          description: Everyone with something today, in join order.
      required:
      - challenges
      - crew
      - day
      - deadline
    UploadModeEnum:
      enum:
      - single
      - multipart
      type: string
      description: |-
        * `single` - One presigned PUT
        * `multipart` - Multipart, resumable
    UserOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        preferred_language:
          $ref: '#/components/schemas/PreferredLanguageEnum'
      required:
      - id
      - preferred_language
      - username
    WindowEnum:
      enum:
      - day
      - week
      - period
      type: string
      description: |-
        * `day` - Each day
        * `week` - Each week, Monday to Sunday
        * `period` - The whole period
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: crew_session
