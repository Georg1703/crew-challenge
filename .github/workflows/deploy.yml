name: Deploy

# After CI passes on a push to main: build the backend and web images for that commit, push them
# to GHCR (tag = git sha), then run deploy.sh on the Lightsail host over SSH. The SSH key can only
# run deploy.sh (a forced command, see infra/scripts/bootstrap-host.sh).
# Run it by hand (Actions -> Deploy -> Run workflow) to redeploy, or to go back to an older sha.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST         the app's host name (sohus.fun)
#   DEPLOY_SSH_KEY      private key whose public half bootstrap-host.sh got
#   DEPLOY_KNOWN_HOSTS  output of: ssh-keyscan -t ed25519 <host>

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full git sha to deploy (empty: the branch you run this from)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/georg1703/crew-challenge

jobs:
  images:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Commit to deploy
        id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha="${INPUT_SHA:-${RUN_SHA:-$GITHUB_SHA}}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Not a full sha: $sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ steps.sha.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: web
          build-contexts: caddy=./infra/caddy
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ steps.sha.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://sohus.fun
    steps:
      - name: Run deploy.sh on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ needs.images.outputs.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 \
            "deploy@$DEPLOY_HOST" "$SHA"
