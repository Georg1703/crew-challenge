name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crew
          POSTGRES_PASSWORD: crew-local-password
          POSTGRES_DB: crew_challenges
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crew" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://crew:crew-local-password@localhost:5432/crew_challenges

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv --directory backend sync --frozen

      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          for sha in $(git rev-list --no-merges "origin/${{ github.base_ref }}..HEAD"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            python3 tools/git_rules.py commit-msg /tmp/msg || { echo "in commit $sha"; exit 1; }
          done

      - name: Branch name
        if: github.event_name == 'pull_request'
        run: python3 tools/git_rules.py branch "${{ github.head_ref }}"

      # Add the frontend toolchain (pnpm) here when frontend/ is created.

      - name: make check
        run: make check
