name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Backend and frontend toolchains are added here in M1.2 / M1.4, and a Postgres
      # service container in M1.10. Until then `make check` skips those areas.

      - name: make check
        run: make check
