[project]
name = "crew-challenges-backend"
version = "0.1.0"
description = "Crew Challenges API: Django + DRF + Celery"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15,<3.17",
    "drf-spectacular>=0.28,<0.30",
    "django-environ>=0.11,<0.13",
    "celery[redis]>=5.4,<5.6",
    "django-celery-beat>=2.7,<2.9",
    "redis>=5.0,<7",
    "psycopg[binary]>=3.2,<3.3",
    "gunicorn>=23,<24",
    "boto3>=1.35,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "pytest-cov>=6,<8",
    "factory-boy>=3.3,<4",
    "time-machine>=2.15,<3",
    "ruff>=0.8,<0.13",
    "mypy>=1.13,<2",
    "django-stubs[compatible-mypy]>=5.1,<6",
    "djangorestframework-stubs[compatible-mypy]>=3.15,<4",
    "boto3-stubs[s3]>=1.35,<2",
    "import-linter>=2.1,<3",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "DJ",           # django
    "DTZ",          # no naive datetimes
    "TID",          # banned APIs (see below)
    "SIM", "RUF", "PT", "C4",
]
ignore = ["RUF012"]  # Django/DRF class attributes are mutable by design

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# Business code gets the current time only from apps.core.clock (UTC, testable).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"django.utils.timezone.now".msg = "Use apps.core.clock.now() (the only source of current time)."
"django.utils.timezone.localdate".msg = "Use apps.core.clock.crew_today(crew)."
"datetime.datetime.now".msg = "Use apps.core.clock.now() (the only source of current time)."
"datetime.datetime.utcnow".msg = "Use apps.core.clock.now() (the only source of current time)."
"datetime.datetime.today".msg = "Use apps.core.clock.now() (the only source of current time)."
"datetime.date.today".msg = "Use apps.core.clock.crew_today(crew) or clock.utc_today()."
"time.time".msg = "Use apps.core.clock.now() (the only source of current time)."

[tool.ruff.lint.per-file-ignores]
"apps/core/clock.py" = ["TID251"]
"**/tests/**" = ["DTZ001"]
"tests/**" = ["DTZ001"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

# Strict where the rules live.
[[tool.mypy.overrides]]
module = ["apps.*.services", "apps.*.selectors", "apps.core.*", "integrations.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["apps.*.tests.*", "tests.*", "integrations.*.tests.*", "apps.core.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["environ.*", "celery.*", "django_celery_beat.*", "kombu.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--no-migrations"]
filterwarnings = [
    "error",
    # Saving a naive datetime is a bug: Django warns, we fail.
    "error:DateTimeField .* received a naive datetime:RuntimeWarning",
    # Third-party noise we do not control.
    "ignore::DeprecationWarning:botocore.*",
    "ignore::DeprecationWarning:celery.*",
    "ignore::DeprecationWarning:kombu.*",
]

# ---------------------------------------------------------------- coverage
# Enforced only where business rules and adapters live (see AGENTS.md).
[tool.coverage.run]
branch = true
include = [
    "apps/*/services.py",
    "apps/*/selectors.py",
    "apps/core/*",
    "integrations/*",
]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/apps.py",
    # Thin boto3 wrapper, checked against the real dev bucket by the upload smoke test.
    "integrations/storage/s3.py",
]

[tool.coverage.report]
fail_under = 90
skip_empty = true
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.$",
]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_packages = ["apps", "integrations", "config"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Services, selectors and models do not depend on the API layer"
type = "forbidden"
source_modules = ["apps.*.services", "apps.*.selectors", "apps.*.models"]
forbidden_modules = ["apps.*.api", "rest_framework"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only integrations talk to external SDKs"
type = "forbidden"
source_modules = ["apps", "config"]
forbidden_modules = ["boto3", "botocore", "pywebpush"]

[[tool.importlinter.contracts]]
name = "Core does not depend on domain apps"
type = "forbidden"
source_modules = ["apps.core"]
forbidden_modules = ["apps.accounts", "apps.crews", "apps.challenges"]
ignore_imports = ["apps.core.tests.** -> apps.accounts.**"]

[[tool.importlinter.contracts]]
name = "Accounts does not depend on crews (crews builds on accounts)"
type = "forbidden"
source_modules = ["apps.accounts"]
forbidden_modules = ["apps.crews"]

[[tool.importlinter.contracts]]
name = "Crews and accounts do not depend on challenges (challenges builds on crews)"
type = "forbidden"
source_modules = ["apps.crews", "apps.accounts"]
forbidden_modules = ["apps.challenges"]

[[tool.importlinter.contracts]]
name = "Integrations do not depend on domain apps"
type = "forbidden"
source_modules = ["integrations"]
forbidden_modules = ["apps"]
